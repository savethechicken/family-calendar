<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Family Calendar</title>
    <link rel="icon" href="data:," />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      (function () {
        var param = new URLSearchParams(location.search).get("theme");
        var theme =
          param === "light" || param === "dark"
            ? param
            : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/static/style.css?v=2" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="title" class="title">Family Calendar</h1>
          <div id="subtitle" class="subtitle">Loading…</div>
        </div>
        <div class="topbar-right">
          <div id="weather" class="weather" aria-live="polite"></div>
          <div id="clock" class="clock" aria-live="off"></div>
          <a class="settings-link" href="/settings" title="Calendar settings" aria-label="Calendar settings">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </a>
        </div>
      </header>

      <main class="layout">
        <aside class="today-panel" aria-label="Today">
          <div class="panel-header">
            <h2 id="today-heading">Today</h2>
            <div id="today-date" class="today-date"></div>
          </div>
          <div id="today-list" class="today-list" role="list"></div>
          <div id="status" class="status"></div>
        </aside>

        <section class="week-panel" aria-label="This week">
          <div id="week-header" class="week-header"></div>
          <div id="week-allday" class="week-allday"></div>
          <div id="week-body" class="week-body">
            <div id="time-gutter" class="time-gutter"></div>
            <div id="week-grid" class="week-grid"></div>
          </div>
        </section>
      </main>

      <div id="banner" class="banner hidden" role="status"></div>
    </div>

    <noscript>This calendar needs JavaScript enabled.</noscript>
    <script type="module" src="/static/app.js?v=2"></script>
  </body>
</html>
